server:
  port: 8084

spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth_route
              uri: http://localhost:8082
              predicates:
                - Path=/api/v1/auth/**

            - id: doctor_route
              uri: http://localhost:8080
              predicates:
                - Path=/api/v1/doctor/**

            - id: patient_route
              uri: http://localhost:8081
              predicates:
                - Path=/api/v1/patient/**

            - id: admin_route
              uri: http://localhost:8083
              predicates:
                - Path=/api/v1/admin/**